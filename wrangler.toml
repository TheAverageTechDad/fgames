# Cloudflare Pages: `pnpm build && npx wrangler pages deploy build --project-name fgames`
# `functions/` deploys with it.
name = "fgames"
pages_build_output_dir = "build"
compatibility_date = "2026-09-01"

# Catcha's Play Together rooms: the game-agnostic relay Worker `catcha-rooms`
# (source: ~/AI Games/clean-up-chase/workers/rooms), shared with clean-up-chase.pages.dev.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"
script_name = "catcha-rooms"

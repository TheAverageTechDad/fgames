<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Offline Games - Nuts & Bolts & Escape</title>
		
		<!-- PWA Manifest & App Config -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#fff6e6" />
		<meta name="description" content="Play 3D Nuts & Bolts screw sorting and Escape car slider puzzle offline anytime without WiFi." />
		
		<!-- iOS Safari PWA tags -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Offline Games" />
		<link rel="apple-touch-icon" href="/icons/pocket-apple.png" />

		<!-- Favicons -->
		<link rel="icon" type="image/svg+xml" href="/icons/pocket-favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=pocket" />

		%sveltekit.head%
	</head>
	<body class="select-none touch-manipulation antialiased overflow-x-hidden" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
